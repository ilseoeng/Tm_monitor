<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f1f5f9;
        }

        .status-card {
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

    <div class="min-h-screen flex flex-col">
        <nav class="bg-white shadow-sm border-b shrink-0">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-user-shield text-blue-600 text-xl"></i>
                    <h1 class="text-xl font-bold text-slate-800">통합 관리 대시보드</h1>
                </div>

                <!-- 관리자 로그인 섹션 -->
                <div id="authSection" class="flex items-center gap-4">
                    <div id="loginForm" class="hidden flex items-center gap-2">
                        <input type="email" id="adminEmail" placeholder="이메일"
                            class="text-sm border rounded px-2 py-1 w-32 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <input type="password" id="adminPassword" placeholder="비밀번호"
                            class="text-sm border rounded px-2 py-1 w-32 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <button id="loginBtn"
                            class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded hover:bg-blue-700 transition-colors">로그인</button>
                    </div>
                    <div id="userInfo" class="hidden flex items-center gap-3">
                        <span id="userEmailDisplay" class="text-sm text-slate-600 font-medium"></span>
                        <button id="logoutBtn"
                            class="text-xs text-slate-400 hover:text-red-500 underline transition-colors">로그아웃</button>
                    </div>
                    <button id="showLoginBtn" class="text-xs text-slate-400 hover:text-blue-600 transition-colors">관리자
                        접속</button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-6 py-8 w-full space-y-6">

            <!-- 상단 중계기 서버 상태 (1분마다 갱신) -->
            <div id="relayStatus"
                class="bg-slate-800 rounded-2xl p-6 text-white shadow-xl flex flex-wrap items-center justify-between gap-6 status-card">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-500/20 p-3 rounded-xl">
                        <i class="fa-solid fa-microchip text-blue-400 text-2xl"></i>
                    </div>
                    <div>
                        <h3 class="text-slate-400 text-xs font-bold uppercase">중계기 서버 상태 (VM)</h3>
                        <p class="text-lg font-bold">SYSTEM_RELAY <span id="relayIndicator"
                                class="text-xs text-gray-400 ml-2">● Checking...</span></p>
                    </div>
                </div>

                <div class="flex gap-8 border-l border-slate-700 pl-8">
                    <div class="text-center">
                        <p class="text-slate-400 text-[10px] uppercase mb-1">CPU Load</p>
                        <p id="main-cpu" class="text-xl font-mono font-bold">-</p>
                    </div>
                    <div class="text-center">
                        <p class="text-slate-400 text-[10px] uppercase mb-1">RAM</p>
                        <p id="main-ram" class="text-xl font-mono font-bold text-emerald-400">-</p>
                    </div>
                    <div class="text-center">
                        <p class="text-slate-400 text-[10px] uppercase mb-1">Disk</p>
                        <p id="main-disk" class="text-xl font-mono font-bold text-blue-400">-</p>
                    </div>
                </div>
            </div>

            <!-- 기기 목록 및 검색 -->
            <div class="bg-white rounded-2xl shadow-sm border p-6">
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <i class="fa-solid fa-mobile-screen-button text-slate-400"></i>
                        <span>등록된 기기 목록</span>
                        <span id="deviceCount" class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500">0대</span>
                    </h2>

                    <!-- 검색 기능 -->
                    <div class="relative w-full md:w-96">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                        </div>
                        <input type="text" id="searchInput"
                            class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5"
                            placeholder="원격 코드 또는 디바이스 ID 검색...">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left border-collapse">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                            <tr>
                                <th class="px-6 py-4 rounded-tl-xl whitespace-nowrap">원격 코드</th>
                                <th class="px-6 py-4 whitespace-nowrap">디바이스 ID (문서번호)</th> <!-- [변경됨] -->
                                <th class="px-6 py-4 text-center whitespace-nowrap">남은 시간</th>
                            </tr>
                        </thead>
                        <tbody id="deviceList" class="divide-y divide-slate-100">
                            <!-- 데이터 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 결제 내역 모달 -->
    <div id="historyModal"
        class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-blue-500"></i>
                    <span id="modalTitle">결제/환불 내역</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto space-y-4">
                <!-- 내역 데이터가 여기에 들어감 -->
                <div class="flex justify-center py-8">
                    <i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-2xl"></i>
                </div>
            </div>
            <div class="px-6 py-4 border-t bg-slate-50 text-right">
                <button onclick="closeModal()"
                    class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-bold transition-colors">닫기</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, query, orderBy, onSnapshot, updateDoc, increment, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsdo-gps3z3nvwJ_EjNe0e4ZI4s4QH7XM",
            projectId: "gen-lang-client-0349319821",
            authDomain: "gen-lang-client-0349319821.firebaseapp.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let isAdmin = false;

        // UI 요소
        const loginForm = document.getElementById('loginForm');
        const userInfo = document.getElementById('userInfo');
        const showLoginBtn = document.getElementById('showLoginBtn');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userEmailDisplay = document.getElementById('userEmailDisplay');

        // 인증 상태 감시
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                isAdmin = true;
                userInfo.classList.remove('hidden');
                loginForm.classList.add('hidden');
                showLoginBtn.classList.add('hidden');
                userEmailDisplay.innerText = user.email;
            } else {
                isAdmin = false;
                userInfo.classList.add('hidden');
                showLoginBtn.classList.remove('hidden');
                userEmailDisplay.innerText = "";
            }
            renderTable(); // 인증 상태 변경 시 버튼 가시성 업데이트를 위해 테이블 다시 그림
        });

        // 로그인 UI 토글
        showLoginBtn.addEventListener('click', () => {
            showLoginBtn.classList.add('hidden');
            loginForm.classList.remove('hidden');
        });

        // 로그인 처리
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("로그인 실패: " + error.message);
            }
        });

        // 로그아웃 처리
        logoutBtn.addEventListener('click', () => signOut(auth));

        let rawDevicesData = [];
        let currentSearchTerm = "";

        // 1. 중계기 서버 상태 (1분 간격 Polling)
        async function fetchRelayStatus() {
            try {
                const q = query(collection(db, "devices"), where("serial_code", "==", "SYSTEM_RELAY"));
                const snapshot = await getDocs(q);
                const indicator = document.getElementById('relayIndicator');

                if (!snapshot.empty) {
                    const data = snapshot.docs[0].data();
                    document.getElementById('main-cpu').innerText = data.cpu || "0.00";
                    document.getElementById('main-ram').innerText = (data.ram || "0") + "%";
                    document.getElementById('main-disk').innerText = (data.disk || "0") + "%";

                    indicator.innerText = "● Online";
                    indicator.className = "text-xs text-emerald-400 ml-2";
                } else {
                    indicator.innerText = "● Offline";
                    indicator.className = "text-xs text-red-400 ml-2";
                }
            } catch (e) {
                console.error("Relay fetch error", e);
            }
        }

        fetchRelayStatus();
        setInterval(fetchRelayStatus, 60000);

        // 2. 일반 기기 목록 실시간 감시
        function loadDevices() {
            const listEl = document.getElementById('deviceList');
            // 정렬 기준이 없다면 기본값으로 정렬 (데이터 양에 따라 orderBy 제거 가능)
            const q = query(collection(db, "devices"));

            onSnapshot(q, (snapshot) => {
                rawDevicesData = [];

                snapshot.forEach(d => {
                    const data = d.data();
                    if (data.serial_code === "SYSTEM_RELAY") return;

                    rawDevicesData.push({
                        id: d.id, // ★ 여기가 핵심: 문서 ID(긴 문자열)를 저장
                        ...data
                    });
                });

                // serial_code 기준으로 정렬 (필요시)
                rawDevicesData.sort((a, b) => (a.serial_code || "").localeCompare(b.serial_code || ""));

                renderTable();
            });
        }

        function renderTable() {
            const listEl = document.getElementById('deviceList');
            const countEl = document.getElementById('deviceCount');
            const headerRow = document.querySelector('thead tr');
            let html = "";

            // 헤더 관리 컬럼 표시 여부
            if (isAdmin) {
                if (!headerRow.querySelector('.mgmt-header')) {
                    const th = document.createElement('th');
                    th.className = "px-6 py-4 rounded-tr-xl text-right whitespace-nowrap mgmt-header";
                    th.innerText = "관리";
                    headerRow.appendChild(th);
                    headerRow.children[0].classList.remove('rounded-tl-xl'); // Clean up rounding if needed
                    headerRow.children[0].classList.add('rounded-tl-xl');
                }
            } else {
                const mgmtHeader = headerRow.querySelector('.mgmt-header');
                if (mgmtHeader) mgmtHeader.remove();
            }

            const filteredData = rawDevicesData.filter(item => {
                const term = currentSearchTerm.toLowerCase();
                const serial = (item.serial_code || "").toLowerCase();
                const docId = (item.id || "").toLowerCase(); // ★ 문서 ID로 검색

                return serial.includes(term) || docId.includes(term);
            });

            filteredData.forEach(data => {
                const seconds = data.remaining_seconds || 0;
                const timeText = `${Math.floor(seconds / 3600)}시간 ${Math.floor((seconds % 3600) / 60)}분`;

                html += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <!-- 원격 코드 -->
                        <td class="px-6 py-5 font-mono font-bold text-blue-600 text-lg whitespace-nowrap">${data.serial_code || 'N/A'}</td>
                        
                        <!-- ★ 디바이스 번호 (문서 ID) -->
                        <td class="px-6 py-5">
                            <span class="font-mono text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded select-all break-all">
                                ${data.id}
                            </span>
                        </td>
                        
                        <!-- 남은 시간 -->
                        <td class="px-6 py-5 text-center whitespace-nowrap">
                            <div class="text-lg font-bold ${seconds < 1800 ? 'text-red-500' : 'text-slate-700'}">${timeText}</div>
                            <div class="text-[10px] text-slate-400">(${seconds}초)</div>
                        </td>
                        
                        <!-- 관리 버튼 (관리자만) -->
                        ${isAdmin ? `
                        <td class="px-6 py-5 text-right space-x-1 whitespace-nowrap">
                            <button onclick="showPaymentHistory('${data.serial_code}')" class="border px-2 py-1 rounded text-xs font-bold text-blue-500 hover:bg-blue-50">내역</button>
                            <button onclick="addTime('${data.id}', 1800)" class="border px-2 py-1 rounded text-xs font-bold text-green-600 hover:bg-green-50">+30분</button>
                            <button onclick="addTime('${data.id}', -1800)" class="border px-2 py-1 rounded text-xs font-bold text-red-500 hover:bg-red-50">-30분</button>
                        </td>
                        ` : ''}
                    </tr>
                `;
            });

            listEl.innerHTML = html;
            countEl.innerText = filteredData.length + "대";

            if (filteredData.length === 0) {
                listEl.innerHTML = `<tr><td colspan="${isAdmin ? 4 : 3}" class="px-6 py-8 text-center text-slate-400">검색 결과가 없습니다.</td></tr>`;
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearchTerm = e.target.value.trim();
            renderTable();
        });

        loadDevices();

        window.addTime = async (docId, sec) => {
            try {
                if (!confirm(`${sec > 0 ? '+30분' : '-30분'}을 적용하시겠습니까?`)) return;

                await updateDoc(doc(db, "devices", docId), {
                    remaining_seconds: increment(sec)
                });
                alert("성공적으로 변경되었습니다.");
            } catch (error) {
                console.error("Error updating time:", error);
                alert("오류가 발생했습니다: " + error.message);
            }
        }

        // 결제 내역 보기
        window.showPaymentHistory = async (serialCode) => {
            const modal = document.getElementById('historyModal');
            const modalBody = document.getElementById('modalBody');
            const modalTitle = document.getElementById('modalTitle');

            modalTitle.innerText = `결제 내역: ${serialCode}`;
            modalBody.innerHTML = `<div class="flex justify-center py-8"><i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-2xl"></i></div>`;
            modal.classList.remove('hidden');

            try {
                // payment_logs 컬렉션에서 serial_code가 일치하는 것 최신순으로 가져오기
                const q = query(
                    collection(db, "payment_logs"),
                    where("serial_code", "==", serialCode),
                    orderBy("timestamp", "desc")
                );

                const snapshot = await getDocs(q);
                let html = "";

                if (snapshot.empty) {
                    html = `<div class="text-center py-8 text-slate-400">결제 내역이 없습니다.</div>`;
                } else {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const date = data.timestamp?.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                        const dateStr = date.toLocaleString('ko-KR');
                        const isRefund = data.status === "refunded" || data.status === "cancel";

                        html += `
                            <div class="border rounded-xl p-4 flex justify-between items-center ${isRefund ? 'bg-red-50 border-red-100' : 'bg-white'}">
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs font-bold uppercase ${isRefund ? 'text-red-500' : 'text-emerald-500'}">
                                            ${data.status === 'completed' ? '결제 완료' : data.status.toUpperCase()}
                                        </span>
                                        <span class="text-[10px] text-slate-400 font-mono">${data.transaction_id || ''}</span>
                                    </div>
                                    <div class="text-xs text-slate-500">${dateStr}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold ${isRefund ? 'text-red-600' : 'text-slate-800'}">
                                        ${data.total_seconds / 60}분 ${isRefund ? '환불' : '추가'}
                                    </div>
                                    <div class="text-[10px] text-slate-400">${data.total_seconds}초</div>
                                </div>
                            </div>
                        `;
                    });
                }
                modalBody.innerHTML = html;
            } catch (error) {
                console.error("Error fetching logs:", error);
                modalBody.innerHTML = `<div class="text-red-500 text-center py-8">데이터를 불러오지 못했습니다: ${error.message}</div>`;
            }
        }

        window.closeModal = () => {
            document.getElementById('historyModal').classList.add('hidden');
        }
    </script>
</body>

</html>
